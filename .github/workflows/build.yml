# Build MedTracker whenever a version tag is pushed. Windows is always built;
# macOS and Linux only when asked for in the tag (or tagged commit) message:
#
#   git tag v1.0.0                                   # Windows only
#   git tag -a v1.0.0 -m "include mac"               # Windows + macOS
#   git tag -a v1.0.0 -m "include mac linux"         # Windows + macOS + Linux
#   git tag -a v1.0.0 -m "include all"               # same as above
#   git push origin v1.0.0
#
# A manual run from the Actions tab has checkboxes for macOS and Linux instead.
#
# Each runner creates a .venv, installs the pinned requirements, runs the tests,
# builds with PyInstaller, and the builds are attached to a GitHub Release.

name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:        # also allows a manual run from the Actions tab (no release)
    inputs:
      include_mac:
        description: Also build macOS (Apple Silicon + Intel)
        type: boolean
        default: false
      include_linux:
        description: Also build Linux
        type: boolean
        default: false

permissions:
  contents: write           # needed to create the release

# Only one build per tag at a time: a newer run for the same tag cancels the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Check out code
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Pick platforms
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          IN_MAC: ${{ inputs.include_mac }}
          IN_LINUX: ${{ inputs.include_linux }}
        run: |
          mac=false; linux=false
          if [ "$EVENT" = "push" ]; then
            # Read the tag message (annotated tags) and the tagged commit's message.
            git fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
            msg=$(git tag -l --format='%(contents)' "$TAG"; git log -1 --format=%B "$TAG")
            msg=$(echo "$msg" | tr '[:upper:]' '[:lower:]')
            if echo "$msg" | grep -Eq 'include.*\b(all)\b'; then mac=true; linux=true; fi
            if echo "$msg" | grep -Eq 'include.*\b(mac|macos)\b'; then mac=true; fi
            if echo "$msg" | grep -Eq 'include.*\b(linux)\b'; then linux=true; fi
          else
            mac="$IN_MAC"; linux="$IN_LINUX"
          fi

          entries='{"os":"windows-latest","asset":"MedTracker-Windows.exe"}'
          if [ "$mac" = "true" ]; then
            entries="$entries"',{"os":"macos-latest","asset":"MedTracker-macOS-AppleSilicon.zip"}'
            entries="$entries"',{"os":"macos-15-intel","asset":"MedTracker-macOS-Intel.zip"}'
          fi
          if [ "$linux" = "true" ]; then
            entries="$entries"',{"os":"ubuntu-22.04","asset":"MedTracker-Linux-x86_64.zip"}'
          fi
          echo "Building: Windows$([ "$mac" = true ] && echo ', macOS')$([ "$linux" = true ] && echo ', Linux')"
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # windows-latest: Windows 10/11, 64-bit
      # macos-latest: Apple Silicon Macs (M1 and newer); macos-15-intel: Intel Macs
      # ubuntu-22.04: older glibc = runs on more Linux versions
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    defaults:
      run:
        shell: bash           # same commands on every OS (Git Bash on Windows)

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system libraries needed by Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 zip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Select the .venv Python
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "VENV_PY=.venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "VENV_PY=.venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: Install requirements into .venv
        run: |
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: '"$VENV_PY" -m pytest'

      - name: Build with PyInstaller
        run: '"$VENV_PY" -m PyInstaller medtracker.spec --noconfirm --clean'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cp dist/MedTracker.exe "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the .app's symlinks and permissions intact; also make a .dmg installer
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MedTracker.app "${{ matrix.asset }}"
          mkdir dmg && cp -R dist/MedTracker.app dmg/ && ln -s /Applications dmg/Applications
          DMG="${{ matrix.asset }}"; DMG="${DMG%.zip}.dmg"
          hdiutil create -volname MedTracker -srcfolder dmg -ov -format UDZO "$DMG"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r -y "../${{ matrix.asset }}" MedTracker

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            MedTracker-macOS-*.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MedTracker ${{ github.ref_name }}
          files: builds/*
          body: |
            Downloads (only the platforms built for this release are attached):
            - **Windows 10/11**: `MedTracker-Windows.exe` - double-click to run
              (if SmartScreen warns, click "More info" then "Run anyway").
            - **Mac with Apple Silicon (M1 or newer)**: `MedTracker-macOS-AppleSilicon.dmg` (or `.zip`)
            - **Mac with Intel processor**: `MedTracker-macOS-Intel.dmg` (or `.zip`)
              Open the .dmg and drag MedTracker to Applications. The app is not notarized by Apple, so
              the first time: try to open it, click **Done**, then go to **System Settings -> Privacy &
              Security** and click **Open Anyway**. (Or run in Terminal:
              `xattr -dr com.apple.quarantine /Applications/MedTracker.app`)
            - **Linux (x86_64)**: `MedTracker-Linux-x86_64.zip` - unzip and run `MedTracker/MedTracker`.
